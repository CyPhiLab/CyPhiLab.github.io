name: Update cv weekly

on:
  workflow_dispatch: {}
  schedule:
    # Every Sunday at 09:17 UTC (early morning US/Eastern)
    - cron: "17 9 * * 0"

permissions:
  contents: write
  pages: read
  id-token: write

concurrency:
  group: update-cv
  cancel-in-progress: true

jobs:
  run-updater:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py311-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py311-

      - name: Install deps
        run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

      - name: Run updater
        env:
          ORCID_ID: "0000-0003-4371-7442"             # or move to repo secrets if you prefer
          ARXIV_AUTHOR: "Zach J. Patterson"           # same
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: |
          set -euo pipefail
          python _scripts/update_cv_markdown.py
          echo "Updater finished."

      - name: Commit changes (if any)
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            ts=$(date -u +"%Y-%m-%d")
            git commit -m "chore: auto-update publications (${ts})"
            git push
            echo "Committed updates."
          else
            echo "No changes to commit."
          fi
